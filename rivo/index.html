<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F8FAFB; --ink:#16202A; --muted:#5A6672; --line:#E2E7EC;
  --brand:#0F766E; --brand-ink:#FFFFFF; --brand-soft:#DCF2EE; --sun:#FFC83D; --sun-soft:#FFF4D4;
  --alert:#D93F45; --alert-soft:#FCEBEC; --good:#15803D; --good-soft:#E3F5E8;
  --c-ad:#2F6FEB; --c-price:#D97706; --c-site:#7C3AED; --c-email:#0891B2; --c-sms:#0E7490;
  --c-social:#DB2777; --c-review:#A16207; --c-gbp:#0F766E; --c-seo:#16A34A;
  --radius-lg:18px; --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 4px 14px rgba(22,32,42,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1519; --surface:#172026; --surface-2:#1C262D; --ink:#E8EEF2; --muted:#9AA7B2; --line:#26323A;
  --brand:#2DB3A6; --brand-ink:#06201E; --brand-soft:#123A36; --sun:#FFCF57; --sun-soft:#3A3115;
  --alert:#F06A6F; --alert-soft:#3A1A1C; --good:#4ADE80; --good-soft:#163221; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0F1519; --surface:#172026; --surface-2:#1C262D; --ink:#E8EEF2; --muted:#9AA7B2; --line:#26323A;
  --brand:#2DB3A6; --brand-ink:#06201E; --brand-soft:#123A36; --sun:#FFCF57; --sun-soft:#3A3115;
  --alert:#F06A6F; --alert-soft:#3A1A1C; --good:#4ADE80; --good-soft:#163221; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fredoka","Assistant",sans-serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:28px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.content{padding:26px 28px 60px;max-width:1180px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Fredoka",sans-serif;font-size:26px;font-weight:600;color:var(--ink);text-decoration:none;padding:4px 8px 16px;direction:ltr;justify-content:flex-end}
.logo svg{width:30px;height:30px}
.nav-group{margin:14px 0 4px;padding:0 10px;font-size:13px;color:var(--muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav a .count{margin-inline-start:auto;background:var(--alert);color:#fff;font-size:12px;border-radius:99px;padding:0 7px;font-weight:700}
.nav svg{width:18px;height:18px;flex:none}
.top .menu-btn{display:none}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:7px 14px}
.search svg{width:16px;height:16px;flex:none;color:var(--muted)}
.search input{border:0;background:none;outline:none;width:100%}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:700;color:#3A2A00}
.icon-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

/* ui atoms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--surface-2)}
a.btn{text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.tag.hot{background:var(--alert-soft);color:var(--alert)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.sun{background:var(--sun-soft);color:#7A5300}
:root[data-theme="dark"] .tag.sun{color:var(--sun)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.input:focus{outline:2px solid var(--brand);outline-offset:0}
label.field{display:grid;gap:6px;font-weight:600;font-size:15px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{margin-top:4px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--muted);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.table-wrap{overflow-x:auto}
.up{color:var(--alert);font-weight:700}
.down{color:var(--good);font-weight:700}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch span:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;inset-inline-start:3px;transition:.2s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span:before{transform:translateX(-18px)}
.switch input:focus-visible+span{outline:3px solid var(--sun)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.trial{display:flex;align-items:center;gap:12px;background:var(--sun-soft);border:1px solid color-mix(in srgb,var(--sun) 55%,transparent);border-radius:var(--radius);padding:12px 16px;margin-bottom:22px;flex-wrap:wrap}
.trial strong{font-weight:700}
.week{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:24px;position:relative;overflow:hidden}
.week h2{font-size:24px}
.week .sub{opacity:.85;margin-top:4px}
.actions{display:grid;gap:12px;margin-top:18px}
.action{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px}
:root[data-theme="dark"] .action{background:rgba(0,0,0,.12)}
.action .n{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#3A2A00;display:grid;place-items:center;font-family:"Fredoka";font-weight:600;font-size:18px}
.action h3{font-size:18px}
.action p{opacity:.88;font-size:15px;margin-top:3px}
.action .btns{display:flex;gap:6px;flex-wrap:wrap}
.action .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
.action .btn:hover{background:rgba(255,255,255,.12)}
.action.done{opacity:.55}
.action.done h3{text-decoration:line-through}
.radar svg{width:100%;height:100%}
.radar{position:absolute;inset-inline-start:-60px;top:-60px;width:240px;height:240px;opacity:.14;pointer-events:none}
.score-ring{display:grid;place-items:center;position:relative;width:132px;height:132px;flex:none}
.score-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.score-ring b{font-family:"Fredoka";font-size:38px;font-weight:600}
.rank{display:grid;gap:9px;margin-top:6px;flex:1;min-width:180px}
.rank-row{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:10px;font-size:14px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--muted)}
.rank-row.me .bar i{background:var(--brand)}
.rank-row.me{font-weight:700}
.feed{display:grid;gap:10px}
.home-top{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.item.imp{border-inline-start:4px solid var(--alert)}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:"Fredoka";font-weight:600;color:#fff;font-size:17px}
.item .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:3px}
.item h3{font-size:16px;font-family:"Assistant";font-weight:700}
.item p{font-size:15px;color:var(--muted);margin-top:2px}
.item .side-act{display:flex;gap:4px}

/* competitors */
.comp-card{display:grid;gap:12px}
.comp-head{display:flex;align-items:center;gap:12px}
.comp-logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:"Fredoka";font-weight:600;font-size:20px;color:#fff;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{font-family:"Fredoka";font-size:20px;font-weight:600;display:block}
.stat span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:16px 0}
.locked{opacity:.5}

/* ads */
.ad{display:grid;gap:10px;padding:14px}
.creative{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;position:relative;overflow:hidden}
.creative .hl{font-family:"Fredoka";font-size:22px;font-weight:600;line-height:1.15}
.creative .cta{margin-top:10px;align-self:flex-start;background:#fff;color:#111;border-radius:8px;padding:4px 10px;font-weight:700;font-size:14px}
.creative .plat{position:absolute;top:10px;inset-inline-end:10px;background:rgba(0,0,0,.35);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.save{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.save.on{background:var(--sun);border-color:var(--sun);color:#3A2A00}
.save svg{width:16px;height:16px}

/* site diff */
.diff{display:grid;gap:6px;margin-top:10px;font-size:15px}
.diff del{background:var(--alert-soft);color:var(--alert);text-decoration:line-through;border-radius:6px;padding:4px 8px;display:block}
.diff ins{background:var(--good-soft);color:var(--good);text-decoration:none;border-radius:6px;padding:4px 8px;display:block}

/* inbox */
.mail{cursor:pointer}
.mail .body{display:none;margin-top:12px;padding:14px;background:var(--surface-2);border-radius:10px;font-size:15px}
.mail.open .body{display:block}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;height:calc(100vh - 210px);min-height:440px;padding:0;overflow:hidden}
.msgs{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:11px 15px;border-radius:16px;font-size:15px;white-space:pre-line}
.msg.bot{background:var(--surface-2);align-self:flex-start;border-start-start-radius:4px}
.msg.me{background:var(--brand);color:var(--brand-ink);align-self:flex-end;border-start-end-radius:4px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 12px}

/* onboarding */
.onb{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(circle at 85% 10%,var(--brand-soft),transparent 40%),var(--bg)}
.onb-box{width:100%;max-width:560px}
.steps{display:flex;gap:6px;margin:20px 0}
.steps i{height:5px;flex:1;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--brand)}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.pick input{width:18px;height:18px;accent-color:var(--brand)}
.pick.disabled{opacity:.55;cursor:not-allowed}

/* billing */
.plan{display:grid;gap:12px;align-content:start}
.plan.best{border:2px solid var(--brand)}
.price{font-family:"Fredoka";font-size:34px;font-weight:600}
.plan ul{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:15px}

.modal-bg{position:fixed;inset:0;background:rgba(10,16,20,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal-bg.show{display:grid}
.modal{width:100%;max-width:460px}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.scrim{display:none}

@media (max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:40;transform:translateX(100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .top .menu-btn{display:grid}
  .top{padding:10px 16px}
  .content{padding:18px 16px 50px}
  .g2,.g3,.g4,.home-top{grid-template-columns:1fr}
  .search{display:none}
  .item{grid-template-columns:38px 1fr}
  .item .side-act{grid-column:2}
  .badge{width:38px;height:38px;font-size:15px}
  .action{grid-template-columns:32px 1fr}
  .action .btns{grid-column:2}
  .msg{max-width:90%}
  h1{font-size:24px}
}
@media print{
  .side,.top,.no-print{display:none!important}
  .app{display:block}
  body{background:#fff}
  .card{box-shadow:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<div class="modal-bg" id="modal"><div class="card modal" id="modal-box"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- icons ---------------- */
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.8 3 2.6 3.5 5.2"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  ad:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-6 3 6M8 13h4M16 9v6"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  site:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  social:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-3.8M8.2 13l7.6 3.8"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  seo:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  team:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.9-3.6 3.7-5.5 7-5.5s6.1 1.9 7 5.5"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  gift:'<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M12 9v12M3 13h18M12 9c-2-4-6-4-6-1.5S10 9 12 9zm0 0c2-4 6-4 6-1.5S14 9 12 9z"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  gauge:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>',
  wa:'<path d="M4 20l1.3-3.8A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1c-1-.5-1.5-1-2-2l1-1-1-2z"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/>',
};
const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const radarSvg = (c='currentColor') => `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="${c}" stroke-width="2.2"/><circle cx="16" cy="16" r="8" fill="none" stroke="${c}" stroke-width="2.2" opacity=".55"/><path d="M16 16L26 6" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/><circle cx="22" cy="19" r="2.6" fill="#FFC83D"/></svg>`;

/* ---------------- mock data ---------------- */
const ME = {name:'בית אורן', site:'beitoren.co.il', owner:'אורן', color:'#0F766E', short:'בא'};

  <aside class="side" id="side">
    <a class="logo" href="#home" aria-label="Rivo">rivo ${radarSvg('var(--brand)')}</a>
    <nav class="nav" aria-label="ניווט ראשי">${nav}</nav>

function feedItem(f){
  const c = comp(f.c), t = TYPES[f.t];
  return `<article class="item ${f.imp?'imp':''}">
    <div class="badge" style="background:${t.color}">${t.letter}</div>
    <div><div class="meta"><span class="dot" style="background:${c.color}"></span><strong style="color:var(--ink)">${c.name}</strong><span>${t.label}</span><span>${f.time}</span>${f.imp?'<span class="tag hot">חשוב</span>':''}</div>
    <h3>${f.title}</h3><p>${f.text}</p></div>
    <div class="side-act">${saveBtn('feed', f.id)}<a class="btn sm ghost" href="#chat" data-act="ask" data-q="${f.title}: מה כדאי לי לעשות?">שאל</a></div>
  </article>`;
}
function feedChips(active, key){
  const types = ['all','ad','price','site','email','social','review','seo'];
  return `<div class="row" style="margin-bottom:12px">${types.map(t=>`<button class="chip ${active===t?'on':''}" data-act="filter" data-key="${key}" data-val="${t}">${t==='all'?'הכול':`<span class="dot" style="background:${TYPES[t].color}"></span>${TYPES[t].label}`}</button>`).join('')}</div>`;
}
function ring(v, size=132){
  const r = size/2-9, C = 2*Math.PI*r;
  return `<div class="score-ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--brand)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}"/></svg><div style="text-align:center"><b>${v}</b><div class="tiny muted">מתוך 100</div></div></div>`;
}
function rankRows(){
  return `<div class="rank">${SCORE.rows.map(r=>`<div class="rank-row ${r.me?'me':''}"><span>${r.n}</span><div class="bar"><i style="width:${r.v}%"></i></div><span>${r.v}</span></div>`).join('')}</div>`;
}

  <div class="card table-wrap"><table><thead><tr><th>שם</th><th>מייל</th><th>הרשאה</th><th>התראות</th></tr></thead><tbody>
  <tr><td><strong>אורן</strong></td><td dir="ltr" style="text-align:right">oren@beitoren.co.il</td><td><span class="tag sun">מנהל</span></td><td>מייל, וואטסאפ</td></tr>
  <tr><td><strong>שירה</strong></td><td dir="ltr" style="text-align:right">shira@beitoren.co.il</td><td><span class="tag">צפייה ועריכה</span></td><td>מייל</td></tr>
  <tr><td><strong>דני</strong></td><td dir="ltr" style="text-align:right">dani@beitoren.co.il</td><td><span class="tag">צפייה בלבד</span></td><td>כבויות</td></tr></tbody></table></div>`;
P.billing = () => `${head('מנוי','המחיר נקבע לפי מספר המתחרים שעוקבים אחריהם. בלי התחייבות.')}
  <p class="tiny muted" style="margin:-8px 0 16px">המחירים כאן לדוגמה בלבד, וייקבעו לפני ההשקה.</p>
  <div class="grid g4">${[
    ['ניסיון','חינם','14 יום',['מתחרה אחד','כל הערוצים','סיכום שבועי'],0],
    ['בסיסי','149 ₪','לחודש',['עד 3 מתחרים','סיכום יומי ושבועי','התראות במייל ובוואטסאפ'],0],
    ['מקצועי','349 ₪','לחודש',['עד 10 מתחרים','שאל את Rivo','דוחות PDF','3 משתמשים'],1],
    ['עסקי','749 ₪','לחודש',['עד 25 מתחרים','משתמשים ללא הגבלה','דוח ממותג','ליווי אישי'],0],
  ].map(([n,p,per,f,best])=>`<div class="card plan ${best?'best':''}">${best?'<span class="tag good" style="justify-self:start">הכי פופולרי</span>':''}<h3>${n}</h3><div><span class="price">${p}</span> <span class="muted small">${per}</span></div><ul>${f.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn ${best?'primary':''}" data-act="toast" data-msg="מעבר לתשלום (בגרסה המלאה)">${n==='ניסיון'?'המסלול הנוכחי':'בחירה'}</button></div>`).join('')}</div>
  <p class="small muted" style="margin-top:14px">תשלום בשקלים, חשבונית מס נשלחת אוטומטית.</p>`;
P.referral = () => `${head('חבר מביא חבר','כל עסק שמצטרף דרכך מקבל חודש חינם, וגם אתה.')}
  <div class="grid g2" style="align-items:start"><div class="card"><h2>הקישור שלך</h2><div class="row" style="margin-top:12px"><input class="input" value="rivo.co.il/r/oren" readonly dir="ltr" style="flex:1"><button class="btn primary" data-act="copy">${ic('copy')}העתקה</button></div>
    <div class="row" style="margin-top:12px"><a class="btn" href="#referral" data-act="toast" data-msg="נפתח וואטסאפ עם הודעה מוכנה">${ic('wa')}שליחה בוואטסאפ</a></div></div>
  <div class="card"><h2>עד עכשיו</h2><div class="stats" style="margin-top:12px"><div class="stat"><b>5</b><span>הזמנות</span></div><div class="stat"><b>2</b><span>הצטרפו</span></div><div class="stat"><b>2</b><span>חודשים שקיבלת</span></div></div></div></div>`;

/* onboarding (2 minutes) */
P.welcome = () => {
  const o = state.onb, dots = [1,2,3].map(i=>`<i class="${i<=o.step?'on':''}"></i>`).join('');
  let body = '';
  if(o.step===1) body = `<h1>בוא נמצא את המתחרים שלך</h1><p class="muted" style="margin-top:6px">מזינים את כתובת האתר, ו-Rivo מוצא את המתחרים לבד. זה לוקח פחות משתי דקות.</p>
    <form data-act="onb-1" style="display:grid;gap:12px;margin-top:20px"><label class="field">כתובת האתר שלך<input class="input" id="onb-site" placeholder="www.example.co.il" dir="ltr" required value="${o.site}"></label><button class="btn primary">חיפוש מתחרים</button></form>`;
  if(o.step===2) body = `<h1>מצאנו 6 מתחרים</h1><p class="muted" style="margin-top:6px">בתקופת הניסיון אפשר לבחור מתחרה אחד. את השאר אפשר להוסיף כשבוחרים מסלול.</p>
    <div style="display:grid;gap:8px;margin-top:18px">${[...COMPS,...SUGGESTED.slice(0,2)].map((c,i)=>{const picked=o.picked.includes(i), dis=!picked&&o.picked.length>=1;return `<label class="pick ${dis?'disabled':''}"><input type="checkbox" data-act="onb-pick" data-i="${i}" ${picked?'checked':''} ${dis?'disabled':''}><div><strong>${c.name}</strong><div class="tiny muted" dir="ltr" style="text-align:right">${c.site}</div></div></label>`}).join('')}</div>
    <div class="row between" style="margin-top:18px"><button class="btn ghost" data-act="onb-back">חזרה</button><button class="btn primary" data-act="onb-next" ${o.picked.length?'':'disabled'}>המשך</button></div>`;
  if(o.step===3) body = `<h1>איך לעדכן אותך?</h1><p class="muted" style="margin-top:6px">אפשר לשנות את זה בכל רגע.</p>
    <div style="display:grid;gap:10px;margin-top:18px"><label class="pick"><input type="checkbox" checked>${ic('mail').replace('<svg','<svg style="width:20px;height:20px"')}<strong>מייל</strong></label><label class="pick"><input type="checkbox" checked>${ic('wa').replace('<svg','<svg style="width:20px;height:20px"')}<strong>וואטסאפ</strong></label>
    <label class="field" style="margin-top:6px">טלפון לוואטסאפ<input class="input" type="tel" dir="ltr" style="text-align:right" placeholder="050-0000000"></label></div>
    <div class="row between" style="margin-top:18px"><button class="btn ghost" data-act="onb-back">חזרה</button><button class="btn primary" data-act="onb-done">התחלת מעקב</button></div>`;
  return `<div class="onb"><div class="onb-box card" style="padding:28px"><div class="logo" style="justify-content:flex-start;padding:0">rivo ${radarSvg('var(--brand)')}</div><div class="steps">${dots}</div>${body}</div></div>`;
};

/* ---------------- router ---------------- */
function render(){
  const [route, arg] = (location.hash.slice(1) || 'home').split('/');
  const fn = P[route] || P.home;
  const root = document.getElementById('root');
  if(route==='welcome'){ root.innerHTML = fn(); }
  else { root.innerHTML = shell(fn(arg), route==='competitor'?'competitors':route); }
  document.title = 'Rivo';
  if(route==='chat'){ const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight; }
  closeMenu();
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

/* ---------------- interactions ---------------- */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function closeMenu(){ document.getElementById('scrim').classList.remove('show'); const s=document.getElementById('side'); if(s) s.classList.remove('open'); }
function modal(html){ document.getElementById('modal-box').innerHTML=html; document.getElementById('modal').classList.add('show'); const f=document.querySelector('#modal-box input'); if(f) f.focus(); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal'||e.target.dataset.act==='close') closeModal(); });
document.getElementById('scrim').addEventListener('click', closeMenu);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeMenu(); }
  if((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.act==='toggle-mail'){ e.preventDefault(); e.target.click(); } });

function answer(q){
  if(/זול|מחיר|ספ/.test(q)) return 'בספה תלת-מושבית נוי הום הכי זולים כרגע, 4,240 ₪ אחרי 15% הנחה. אתה ב-4,590 ₪, כלומר יקר ב-350 ₪.\n\nאם לא רוצים להוריד מחיר, אפשר להוסיף ערך: משלוח והרכבה חינם או כרית נוי במתנה.';
  if(/תלונ|ביקור/.test(q)) return 'הנושאים שחוזרים הכי הרבה:\n• רהיטי גלבוע: עיכובים באספקה (11 ביקורות)\n• נוי הום: שירות לקוחות לא זמין (7)\n• לופט סטודיו: איכות הבד (5)\n\nההזדמנות הכי חזקה היא אספקה מהירה.';
  if(/מודעה|כתוב/.test(q)) return 'הצעה למודעה:\n\nכותרת: הספה החדשה בסלון, תוך 3 שבועות\nטקסט: בלי לחכות חודשיים. ספות באיכות גבוהה, משלוח והרכבה עד הבית.\nכפתור: לקטלוג הספות\n\nרוצה גרסה עם הנחה או בלי?';
  if(/נוי|עשו|סכם/.test(q)) return 'החודש נוי הום:\n• הורידו 15% על כל הספות\n• העלו 4 מודעות חדשות במטא\n• שלחו ניוזלטר עם קופון 5% ו-SMS על משלוח חינם\n\nהם דוחפים מבצע אחד בכל הערוצים, כנראה כדי לנקות מלאי לפני החורף.';
  if(/גוגל|SEO|לעלות|דף/.test(q)) return 'כדי לחזור לטופ 3 ב"שולחן אוכל נפתח":\n• להוסיף לדף המוצר מידות פתוח וסגור\n• להוסיף 4 עד 5 שאלות ותשובות\n• לבקש מלקוחות ביקורות עם תמונה\n\nלופט סטודיו עקפו אותך אחרי שהוסיפו בדיוק את זה.';
  return 'בגרסה המלאה התשובה תתבסס על כל המידע שנאסף על המתחרים שלך. בינתיים אפשר לנסות את השאלות המוצעות למטה.';
}
function ask(q){
  state.chat.push({me:true,text:q}); state.chat.push({me:false,text:answer(q)});
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  if(a==='menu'){ document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
  if(a==='theme'){ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; }
  if(a==='filter'){ state[el.dataset.key]=el.dataset.val; render(); }
  if(a==='done'){ const i=+el.dataset.i; state.done.has(i)?state.done.delete(i):state.done.add(i); render(); }
  if(a==='ask'){ state.chat=[state.chat[0]]; ask(el.dataset.q); }
  if(a==='quick'){ ask(el.dataset.q); render(); }
  if(a==='save'){ const kind=el.dataset.kind, ref=+el.dataset.ref; const i=state.saved.findIndex(s=>s.kind===kind&&s.ref===ref);
    if(i>-1){ state.saved.splice(i,1); toast('הוסר מספריית ההשראה'); } else { state.saved.push({kind,ref,tags:[]}); toast('נשמר לספריית ההשראה'); } render(); }
  if(a==='add-tag'){ modal(`<h2>תגית חדשה</h2><form data-act="tag-save" data-i="${el.dataset.i}" style="display:grid;gap:12px;margin-top:14px"><input class="input" name="t" placeholder="למשל: מבצע, סרטון, מסר איכות" required><div class="row"><button class="btn primary">הוספה</button><button type="button" class="btn ghost" data-act="close">ביטול</button></div></form>`); }
  if(a==='add-comp'){ modal(`<h2>הוספת מתחרה</h2><p class="small muted" style="margin-top:4px">מספיק להזין את כתובת האתר. את עמודי הרשתות Rivo ימצא לבד.</p><form data-act="comp-save" style="display:grid;gap:12px;margin-top:14px"><input class="input" name="u" placeholder="www.competitor.co.il" dir="ltr" required><div class="row"><button class="btn primary">הוספה</button><button type="button" class="btn ghost" data-act="close">ביטול</button></div></form>`); }
  if(a==='add-suggested'){ toast(`${SUGGESTED[+el.dataset.i].name} נוסף למעקב`); el.disabled=true; el.textContent='במעקב'; }
  if(a==='invite'){ modal(`<h2>הזמנת משתמש</h2><form data-act="invite-save" style="display:grid;gap:12px;margin-top:14px"><input class="input" type="email" placeholder="name@company.co.il" dir="ltr" required><select class="input"><option>צפייה ועריכה</option><option>צפייה בלבד</option><option>מנהל</option></select><div class="row"><button class="btn primary">שליחת הזמנה</button><button type="button" class="btn ghost" data-act="close">ביטול</button></div></form>`); }
  if(a==='toggle-mail'){ el.classList.toggle('open'); el.setAttribute('aria-expanded', el.classList.contains('open')); }
  if(a==='copy'){ navigator.clipboard?.writeText('https://rivo.co.il/r/oren').catch(()=>{}); toast('הקישור הועתק'); }
  if(a==='toast'){ e.preventDefault(); toast(el.dataset.msg); }
  if(a==='onb-back'){ state.onb.step--; render(); }
  if(a==='onb-next'){ state.onb.step=3; render(); }
  if(a==='onb-done'){ toast('המעקב התחיל. הסיכום הראשון יגיע מחר בבוקר'); location.hash='home'; }
});
document.addEventListener('change', e=>{
  const a = e.target.dataset.act;
  if(a==='adlong'){ state.adLong=e.target.checked; render(); }
  if(a==='onb-pick'){ const i=+e.target.dataset.i; state.onb.picked = e.target.checked ? [i] : []; render(); }
});
document.addEventListener('submit', e=>{
  const f = e.target, a = f.dataset.act; if(!a) return; e.preventDefault();
  if(a==='send'){ const inp=document.getElementById('chat-in'); const q=inp.value.trim(); if(!q) return; ask(q); render(); document.getElementById('chat-in').focus(); }
  if(a==='tag-save'){ const t=f.t.value.trim(); if(t){ state.saved[+f.dataset.i].tags.push(t); } closeModal(); render(); }
  if(a==='comp-save'){ closeModal(); toast('המתחרה נוסף. הנתונים הראשונים יופיעו תוך כמה דקות'); }
  if(a==='invite-save'){ closeModal(); toast('ההזמנה נשלחה'); }
  if(a==='report'){ window.print(); }
  if(a==='onb-1'){ state.onb.site=document.getElementById('onb-site').value; state.onb.step=2; render(); }
});

render();
</script>
</body>
</html>
