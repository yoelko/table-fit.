/* ---------- light / dark ---------- */
const MOON='<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
function isDark(){ const t=document.documentElement.dataset.theme; return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches; }
function applyTheme(t){
  if(t) document.documentElement.dataset.theme=t;
  const d=isDark();
  $("themeIco").innerHTML=d?SUN:MOON;
  $("themeBtn").setAttribute("aria-label",d?"מעבר למצב בהיר":"מעבר למצב כהה");
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",d?"#0f0806":"#2b120d");
}
applyTheme(store.get("tf-theme",null));
$("themeBtn").onclick=()=>{ const t=isDark()?"light":"dark"; store.set("tf-theme",t); applyTheme(t); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>applyTheme());

/* ---------- projects ---------- */
let pEdit=null;   // {id, mode:"rename"|"delete"}
function renderProjName(){ $("projName").textContent=cur.name; $("projBtn").setAttribute("aria-label",`הפרויקט הפתוח: ${cur.name}. לחיצה פותחת את רשימת הפרויקטים`); }
function projInfo(p){
  const r=Object.assign(DEFAULT_ROOM(),p.room||{}), pts=roomPoints(r);
  const mx=Math.round(Math.max(...pts.map(q=>q[0]))), my=Math.round(Math.max(...pts.map(q=>q[1])));
  const n=(r.tables||[]).length, d=new Date(p.updated||Date.now()), now=new Date();
  const when=d.toDateString()===now.toDateString()?`היום ${d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}`:d.toLocaleDateString("he-IL");
  return `${n} שולחנות · חדר ${mx}×${my} ס״מ · עודכן ${when}`;
}
function renderProjects(){
  const list=$("plist"); list.innerHTML="";
  [...PROJ.list].sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(p=>{
    const row=document.createElement("div"); row.className="prow"; row.setAttribute("aria-current",p.id===cur.id);
    const ed=pEdit?.id===p.id?pEdit.mode:null;
    if(ed==="rename"){
      row.innerHTML=`<label class="hint" for="ren-${p.id}" style="margin:0">שם חדש</label>
        <input class="text" id="ren-${p.id}" value="${esc(p.name)}">
        <div class="row"><button type="button" class="btn solid" data-a="ok">שמירה</button><button type="button" class="btn ghost" data-a="cancel">ביטול</button></div>`;
      const inp=row.querySelector("input"), ok=()=>{ const v=inp.value.trim(); if(v){p.name=v; saveProjects(); if(p===cur) renderProjName();} pEdit=null; renderProjects(); };
      row.querySelector('[data-a="ok"]').onclick=ok; inp.onkeydown=e=>{ if(e.key==="Enter") ok(); };
      row.querySelector('[data-a="cancel"]').onclick=()=>{pEdit=null; renderProjects();};
      list.append(row); setTimeout(()=>{inp.focus(); inp.select();},0); return;
    }
    if(ed==="delete"){
      row.innerHTML=`<div class="pconfirm"><p>למחוק את "${esc(p.name)}"? אי אפשר לשחזר פרויקט שנמחק.</p>
        <div class="row"><button type="button" class="btn danger" data-a="ok">כן, למחוק</button><button type="button" class="btn ghost" data-a="cancel">ביטול</button></div></div>`;
      row.querySelector('[data-a="ok"]').onclick=()=>{ pEdit=null; deleteProject(p.id); };
      row.querySelector('[data-a="cancel"]').onclick=()=>{pEdit=null; renderProjects();};
      list.append(row); return;
    }
    row.innerHTML=`<button type="button" class="popen"><div><b>${esc(p.name)}</b><span>${projInfo(p)}</span></div>${p.id===cur.id?'<span class="badge">פתוח</span>':""}</button>
      <div class="pacts"><button type="button" class="link" data-a="ren">שינוי שם</button><button type="button" class="link" data-a="dup">שכפול</button><button type="button" class="link" data-a="del" style="color:var(--bad)">מחיקה</button></div>`;
    row.querySelector(".popen").onclick=()=>{ switchProject(p.id); $("proj").hidden=true; toast(`נפתח: ${p.name}`); };
    row.querySelector('[data-a="ren"]').onclick=()=>{pEdit={id:p.id,mode:"rename"}; renderProjects();};
    row.querySelector('[data-a="dup"]').onclick=()=>duplicateProject(p.id);
    row.querySelector('[data-a="del"]').onclick=()=>{pEdit={id:p.id,mode:"delete"}; renderProjects();};
    list.append(row);
  });
}
function loadInto(p){
  for(const k of Object.keys(state)) delete state[k];
  Object.assign(state,DEFAULT_ROOM(),clone(p.room||{}));
  if(!Array.isArray(state.furn)) state.furn=[];
  for(const k of Object.keys(STYLE)) delete STYLE[k];
  Object.assign(STYLE,DEFAULT_STYLE(),p.style||{});
  lastRoomJSON=JSON.stringify(roomData());
  undoStack.length=0; lastPush=0; $("undo").disabled=true;
  $("vizTitle").value=STYLE.title||"";
  P=roomPoints(); G=buildGrid(P); select(null); renderPanel(); renderProjName();
}
function switchProject(id){
  saveRoom();
  const p=PROJ.list.find(x=>x.id===id); if(!p||p===cur) return;
  cur=p; PROJ.current=id; saveProjects(); loadInto(p);
}
function createProject(name){
  saveRoom();
  const p={id:newId(),name,updated:Date.now(),room:DEFAULT_ROOM(),style:Object.assign(DEFAULT_STYLE(),{brand:STYLE.brand,felt:STYLE.felt,floor:STYLE.floor,wall:STYLE.wall,title:name})};
  PROJ.list.push(p); cur=p; PROJ.current=p.id; saveProjects(); loadInto(p);
}
function duplicateProject(id){
  saveRoom();
  const p=PROJ.list.find(x=>x.id===id); if(!p) return;
  const c={id:newId(),name:p.name+" (עותק)",updated:Date.now(),room:clone(p.room||{}),style:clone(p.style||{})};
  PROJ.list.push(c); saveProjects(); renderProjects(); toast(`נוצר עותק: ${c.name}`);
}
function deleteProject(id){
  const i=PROJ.list.findIndex(x=>x.id===id); if(i<0) return;
  const [gone]=PROJ.list.splice(i,1);
  if(!PROJ.list.length){ const p={id:newId(),name:"פרויקט חדש",updated:Date.now(),room:DEFAULT_ROOM(),style:DEFAULT_STYLE()}; PROJ.list.push(p); }
  if(gone===cur){ const next=[...PROJ.list].sort((a,b)=>(b.updated||0)-(a.updated||0))[0]; cur=next; PROJ.current=next.id; saveProjects(); loadInto(next); }
  else saveProjects();
  renderProjects(); toast(`נמחק: ${gone.name}`);
}
$("projBtn").onclick=()=>{ saveRoom(); pEdit=null; renderProjects(); $("proj").hidden=false; $("newProjName").value=""; };
$("projClose").onclick=()=>{ $("proj").hidden=true; };
$("newProjBtn").onclick=()=>{
  const name=$("newProjName").value.trim();
  if(!name){ $("newProjName").focus(); toast("כתבו שם לפרויקט, למשל שם הלקוח."); return; }
  createProject(name); $("proj").hidden=true; toast(`נוצר פרויקט: ${name}. התחילו במידות החדר.`); setTab("room");
};
$("newProjName").onkeydown=e=>{ if(e.key==="Enter") $("newProjBtn").click(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("proj").hidden) $("proj").hidden=true; });
renderProjName();

/* ---------- start ---------- */
P=roomPoints(); G=buildGrid(P);
if(firstRun){
  const it=items.find(x=>/9 פיט/.test(x.name))||items[0], t=newTable(it), s=placeAny(dims(t).N,G)||placeAny(dims(t).O,G);
  if(s){t.cx=s.cx;t.cy=s.cy;t.rot=s.rot; state.tables.push(t);}
}
if(!store.get("tf-tip2",false)) $("tip").hidden=false;
$("tipOk").onclick=()=>{ $("tip").hidden=true; store.set("tf-tip2",true); };
setTab(["room","tables","furn","gaps"].includes(tab)?tab:"tables"); setDrawer(false);
drawPlan();
</script>

<script>
/* Auto-update: when a newer version is published, reload into it. */
const APP_VERSION="18";
async function checkUpdate(){
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});
    const v=(await r.json()).version;
    if(v && v!==APP_VERSION){
      if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
      const reg=await navigator.serviceWorker?.getRegistration(); await reg?.update();
      location.reload();
    }
  }catch(e){}
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
checkUpdate();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
</script>
