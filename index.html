<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שולחן לחדר">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>איזה שולחן נכנס לחדר?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app. Floor plan always visible on top (side on desktop), tabs + panel below it. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1c2420; --muted:#5f6b64; --line:#d6ddd8;
  --felt:#1f6b4a; --felt-soft:#e2efe8; --wood:#8a5a34; --zone:#2f7d5b; --pillar:#55606a;
  --ok:#1f7a45; --warn:#b26a00; --bad:#b3322a; --shadow:rgb(20 30 25 / .14);
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --ink:#e7eee9; --muted:#9aa8a0; --line:#2c3832;
  --felt:#3fa274; --felt-soft:#1d3329; --wood:#c08a5c; --zone:#56b88a; --pillar:#8d99a3;
  --ok:#57c483; --warn:#f0a940; --bad:#ef6b61; --shadow:rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e7eee9; --muted:#9aa8a0; --line:#2c3832;
  --felt:#3fa274; --felt-soft:#1d3329; --wood:#c08a5c; --zone:#56b88a; --pillar:#8d99a3;
  --ok:#57c483; --warn:#f0a940; --bad:#ef6b61; --shadow:rgb(0 0 0 / .45); color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--felt);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.top h1{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.1;margin:0}
.sum{font-size:.85rem;font-weight:700;margin:2px 0 0}
.iconbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-inline-start:auto}
.iconbtn[disabled]{opacity:.4;cursor:default}

.stage{flex:0 0 auto;height:min(50vh,560px);margin-inline:16px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.stage svg{flex:1;min-height:0;width:100%;display:block;touch-action:none;direction:ltr;user-select:none;-webkit-user-select:none}
.selbar{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.selhead{display:flex;align-items:center;gap:8px;min-width:0}
.selhead b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selhead .x{all:unset;cursor:pointer;margin-inline-start:auto;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:1.1rem;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:.78rem;font-weight:700;color:var(--ink);background:var(--bg)}
.act svg{width:20px;height:20px}
.act.danger{color:var(--bad)}
.act[aria-pressed="true"]{background:var(--felt-soft);color:var(--felt)}

.tip{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.tip .card{pointer-events:auto;max-width:320px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px var(--shadow);padding:16px}
.tip ol{margin:6px 0 12px;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.tip h2{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 16px 0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:9px 4px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--felt);color:#fff}
.panel{flex:1;min-height:0;overflow:auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px}
.panel h3{font-size:.8rem;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;font-weight:700}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.82rem;text-align:center}
.chip svg{width:26px;height:26px}
.chip[aria-pressed="true"]{border-color:var(--felt);background:var(--felt-soft);color:var(--felt)}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chip small{font-weight:600;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stp{display:flex;flex-direction:column;gap:4px;min-width:0}
.stp label{font-size:.82rem;font-weight:600;color:var(--muted)}
.stp-row{direction:ltr;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stp-row:focus-within{border-color:var(--felt)}
.stp-b{all:unset;cursor:pointer;height:44px;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:var(--felt);background:var(--bg)}
.stp-b:active{background:var(--felt-soft)}
.stp-mid{display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:0}
.stp input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:700 1.15rem var(--body);text-align:center;padding:0;font-variant-numeric:tabular-nums;outline:none}
.stp .unit{font-size:.75rem;color:var(--muted);white-space:nowrap}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;padding:10px 14px;border-radius:10px;border:1.5px solid var(--felt);color:var(--felt);text-align:center}
.btn.solid{background:var(--felt);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px}

.sizes{display:flex;flex-direction:column;gap:8px}
.size{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.size-top{display:flex;align-items:center;gap:10px;min-width:0}
.size-name{flex:1;min-width:0;cursor:pointer}
.size-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.size-name span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.size-acts{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.size-acts .btn{padding:9px 8px}
.edit{all:unset;cursor:pointer;width:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line)}
.edit[aria-expanded="true"]{background:var(--felt-soft);border-color:var(--felt)}
.size-edit{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px dashed var(--line)}
.text{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 1rem var(--body);padding:10px 12px;width:100%}

.sketch{display:flex;align-items:center;gap:12px}
.sketch img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.status{font-size:.88rem;margin:0}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px var(--shadow);z-index:10;transition:opacity .2s}
.toast[hidden]{display:block!important;opacity:0;pointer-events:none}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:1fr 420px;grid-template-rows:auto auto 1fr}
  .top{grid-column:1/-1}
  .stage{grid-row:2/4;height:auto;margin:0 16px 16px}
  .tabs{margin:0 0 0 16px}
  .panel{padding-inline:0 16px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<div class="app" dir="rtl">
  <header class="top">
    <div>
      <h1>איזה שולחן נכנס לחדר?</h1>
      <p class="sum" id="summary"></p>
    </div>
    <button type="button" class="iconbtn" id="undo" disabled aria-label="ביטול הפעולה האחרונה">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></svg>ביטול
    </button>
  </header>

  <section class="stage" aria-label="תוכנית החדר">
    <svg id="svg" role="img"></svg>
    <div class="selbar" id="selbar" hidden></div>
    <div class="tip" id="tip" hidden>
      <div class="card">
        <h2>איך זה עובד</h2>
        <ol>
          <li>בלשונית <b>חדר</b> קובעים צורה ומידות.</li>
          <li>בלשונית <b>שולחנות</b> מוסיפים שולחן או ממלאים את החדר.</li>
          <li>גוררים שולחן באצבע. לחיצה עליו פותחת סיבוב, שכפול ומחיקה.</li>
        </ol>
        <button type="button" class="btn solid" id="tipOk" style="width:100%">הבנתי</button>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="הגדרות">
    <button type="button" role="tab" id="tab-room" aria-controls="panel" data-tab="room">חדר</button>
    <button type="button" role="tab" id="tab-tables" aria-controls="panel" data-tab="tables">שולחנות</button>
    <button type="button" role="tab" id="tab-gaps" aria-controls="panel" data-tab="gaps">מרחקים</button>
  </nav>
  <main class="panel" id="panel" role="tabpanel"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const RAIL=13, CELL=5;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Math.round(+v||0)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};

/* ---------- saved settings ---------- */
const KIND={cue:true, foos:true, air:true};
const DEFAULT_SIZES=[
  {name:"ביליארד 7 פיט", kind:"cue", L:213, W:122},
  {name:"ביליארד 8 פיט", kind:"cue", L:244, W:137},
  {name:"ביליארד 9 פיט (תחרותי)", kind:"cue", L:292, W:161},
  {name:"סנוקר 12 פיט", kind:"cue", L:382, W:203},
  {name:"כדורגל שולחן", kind:"foos", L:145, W:75},
  {name:"הוקי אוויר 7 פיט", kind:"air", L:213, W:121},
];
let items=store.get("tf-sizes-v1",null);
if(!Array.isArray(items)||!items.length) items=DEFAULT_SIZES.map(x=>({...x}));
items.forEach(x=>{ if(!KIND[x.kind]) x.kind="cue"; if(x.name==="ביליארד 9 פיט (תחרותי)"&&x.L===280&&x.W===155){x.L=292;x.W=161;} });
const saveSizes=()=>store.set("tf-sizes-v1",items.map(({name,kind,L,W,custom})=>({name,kind,L,W,custom})));
const GAP=Object.assign({wall:140,table:140},store.get("tf-gaps-v1",{}));
const saveGaps=()=>store.set("tf-gaps-v1",GAP);

const SHAPES={
  rect:{label:"מלבן", icon:"M3 6h18v12H3z"},
  L:{label:"צורת L", icon:"M3 6h10v5h8v7H3z", cut:["אורך הפינה החסרה","רוחב הפינה החסרה"],
     hint:"הפינה החסרה נמצאת בצד ימין למעלה בציור, למשל פינת מטבח.",
     pts:(L,W,a,b)=>[[0,0],[L-a,0],[L-a,b],[L,b],[L,W],[0,W]]},
  U:{label:"צורת U", icon:"M3 6h6v5h6V6h6v12H3z", cut:["רוחב השקע","עומק השקע"],
     hint:"שקע באמצע הקיר העליון, למשל ארון בנוי או חדר מדרגות.",
     pts:(L,W,a,b)=>{const x0=(L-a)/2,x1=(L+a)/2;return [[0,0],[x0,0],[x0,b],[x1,b],[x1,0],[L,0],[L,W],[0,W]]}},
  diag:{label:"פינה אלכסונית", icon:"M3 6h12l6 5v7H3z", cut:["אורך החיתוך","עומק החיתוך"],
     hint:"פינה ימנית עליונה שנחתכה בקיר אלכסוני.",
     pts:(L,W,a,b)=>[[0,0],[L-a,0],[L,b],[L,W],[0,W]]},
};

const firstRun=!store.get("tf-room-v1",null);
const state=Object.assign({shape:"rect",L:600,W:450,a:180,b:140,custom:null,cols:[],tables:[]},store.get("tf-room-v1",{}));
const saveRoom=()=>store.set("tf-room-v1",{shape:state.shape,L:state.L,W:state.W,a:state.a,b:state.b,custom:state.custom,cols:state.cols,tables:state.tables});
let tab=store.get("tf-tab","tables");
let sel=null;           // {type:"t"|"c", o:object}
let editOpen=false;     // size editor open in the selection bar
let openSize=-1;        // size card expanded for editing

/* ---------- undo ---------- */
const undoStack=[]; let lastPush=0;
function snapshot(){ return JSON.stringify({shape:state.shape,L:state.L,W:state.W,a:state.a,b:state.b,custom:state.custom,cols:state.cols,tables:state.tables}); }
// Rapid changes (stepper taps, a drag) collapse into one undo step.
function pushUndo(force){
  const now=Date.now();
  if(!force && now-lastPush<900){ lastPush=now; return; }
  lastPush=now; undoStack.push(snapshot()); if(undoStack.length>60) undoStack.shift();
  $("undo").disabled=false;
}
$("undo").onclick=()=>{
  const s=undoStack.pop(); if(!s) return;
  Object.assign(state,JSON.parse(s)); lastPush=0;
  $("undo").disabled=!undoStack.length;
  P=roomPoints(); G=buildGrid(P); select(null); renderPanel(); toast("בוטל");
};

/* ---------- geometry ---------- */
function roomPoints(){
  if(state.custom) return state.custom;
  const {L,W}=state;
  if(state.shape==="rect"||!SHAPES[state.shape]) return [[0,0],[L,0],[L,W],[0,W]];
  const a=Math.max(0,Math.min(state.a,L-50)), b=Math.max(0,Math.min(state.b,W-50));
  return SHAPES[state.shape].pts(L,W,a,b);
}
function inPoly(x,y,P){
  let c=false;
  for(let i=0,j=P.length-1;i<P.length;j=i++){
    const [xi,yi]=P[i],[xj,yj]=P[j];
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) c=!c;
  }
  return c;
}
// A 5 cm grid of the floor, blocked outside the walls and under columns.
// A prefix sum answers "is this rectangle free floor?" in constant time.
function buildGrid(P){
  const maxX=Math.max(...P.map(p=>p[0])), maxY=Math.max(...P.map(p=>p[1]));
  const nx=Math.ceil(maxX/CELL), ny=Math.ceil(maxY/CELL);
  const S=new Int32Array((nx+1)*(ny+1));
  for(let j=0;j<ny;j++){
    let rowSum=0; const y=(j+.5)*CELL;
    for(let i=0;i<nx;i++){
      const x=(i+.5)*CELL;
      let blocked=!inPoly(x,y,P);
      if(!blocked) for(const c of state.cols) if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h){blocked=true;break;}
      rowSum+=blocked?1:0;
      S[(j+1)*(nx+1)+i+1]=S[j*(nx+1)+i+1]+rowSum;
    }
  }
  return {nx,ny,S,maxX,maxY};
}
function freeRect(G,i,j,w,h){ const n=G.nx+1,S=G.S; return S[(j+h)*n+i+w]-S[j*n+i+w]-S[(j+h)*n+i]+S[j*n+i]===0; }
function gridFree(G,r){
  const i0=Math.round(r.x/CELL),j0=Math.round(r.y/CELL),i1=Math.round((r.x+r.w)/CELL),j1=Math.round((r.y+r.h)/CELL);
  if(i0<0||j0<0||i1>G.nx||j1>G.ny||i1<=i0||j1<=j0) return false;
  return freeRect(G,i0,j0,i1-i0,j1-j0);
}
function placeAny(d,G){
  let best=null,bestD=Infinity; const tx=G.maxX/2,ty=G.maxY/2;
  for(const [dw,dh] of [[d[0],d[1]],[d[1],d[0]]]){
    const w=Math.ceil(dw/CELL),h=Math.ceil(dh/CELL); if(w>G.nx||h>G.ny) continue;
    for(let j=0;j+h<=G.ny;j++) for(let i=0;i+w<=G.nx;i++){
      if(!freeRect(G,i,j,w,h)) continue;
      const cx=(i+w/2)*CELL,cy=(j+h/2)*CELL,dd=(cx-tx)**2+(cy-ty)**2;
      if(dd<bestD){bestD=dd;best={cx,cy,rot:dw<dh};}
    }
  }
  return best;
}
const box=(cx,cy,d)=>({x:cx-d[0]/2,y:cy-d[1]/2,w:d[0],h:d[1]});
const hit=(a,b)=>a.x<b.x+b.w-1&&b.x<a.x+a.w-1&&a.y<b.y+b.h-1&&b.y<a.y+a.h-1;
function sep(a,b){
  const dx=Math.max(0,a.x-(b.x+b.w),b.x-(a.x+a.w)), dy=Math.max(0,a.y-(b.y+b.h),b.y-(a.y+a.h));
  return dx&&dy?Math.hypot(dx,dy):Math.max(dx,dy);
}
function dims(t,rot=t.rot){
  const r=d=>rot?[d[1],d[0]]:d, L=t.L, W=t.W;
  const PL=t.kind==="cue"?[Math.max(20,L-2*RAIL),Math.max(20,W-2*RAIL)]:[L*.82,W*.7];
  return {O:r([L,W]),PL:r(PL),N:r([L+2*GAP.wall,W+2*GAP.wall])};
}
function sizeStatus(it){
  const d=dims({...it,rot:false});
  if(placeAny(d.N,G)) return {cls:"ok",txt:"נכנס"};
  if(placeAny(d.O,G)) return {cls:"warn",txt:"צפוף"};
  return {cls:"bad",txt:"לא נכנס"};
}
function tableStatus(t){
  const D=dims(t), body=box(t.cx,t.cy,D.O);
  const others=state.tables.filter(o=>o!==t).map(o=>box(o.cx,o.cy,dims(o).O));
  if(!gridFree(G,body)||others.some(o=>hit(o,body))) return "bad";
  const wallOk=gridFree(G,box(t.cx,t.cy,D.N)), tableOk=others.every(o=>sep(o,body)>=GAP.table-1);
  return wallOk&&tableOk?"ok":"warn";
}
// First free spot scanning from the top-left corner, so repeated adds pack the room in rows.
function findSpot(t,byCol=false,rots=[false,true]){
  let best=null;
  const bodies=state.tables.filter(o=>o!==t).map(o=>box(o.cx,o.cy,dims(o).O));
  for(const rot of rots){
    const D=dims(t,rot), Z=D.N, w=Math.ceil(Z[0]/CELL), h=Math.ceil(Z[1]/CELL);
    const A=byCol?G.nx-w:G.ny-h, B=byCol?G.ny-h:G.nx-w;
    for(let a=0;a<=A;a++){
      if(best&&a>=best.a) break;
      for(let b=0;b<=B;b++){
        const i=byCol?a:b, j=byCol?b:a;
        if(!freeRect(G,i,j,w,h)) continue;
        const cx=i*CELL+Z[0]/2, cy=j*CELL+Z[1]/2, bb=box(cx,cy,D.O);
        if(bodies.some(o=>hit(o,bb)||sep(o,bb)<GAP.table-.5)) continue;
        best={a,cx,cy,rot}; break;
      }
    }
  }
  return best;
}
function rayDist(x,y,dx,dy,self){
  const segs=[];
  const rectSegs=(b,k)=>{const q=[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]];for(let i=0;i<4;i++) segs.push([q[i],q[(i+1)%4],k]);};
  for(const o of state.tables) if(o!==self) rectSegs(box(o.cx,o.cy,dims(o).O),"table");
  for(let i=0;i<P.length;i++) segs.push([P[i],P[(i+1)%P.length],"wall"]);
  for(const c of state.cols) rectSegs(c,"wall");
  let best=Infinity,kind="wall";
  for(const [p,q,k] of segs){
    let d;
    if(dx){ if((p[1]>y)===(q[1]>y)) continue; d=(p[0]+(y-p[1])*(q[0]-p[0])/(q[1]-p[1])-x)*dx; }
    else  { if((p[0]>x)===(q[0]>x)) continue; d=(p[1]+(x-p[0])*(q[1]-p[1])/(q[0]-p[0])-y)*dy; }
    if(d>=-.5&&d<best){best=Math.max(0,d);kind=k;}
  }
  return {d:best,kind};
}

/* ---------- plan ---------- */
let G=null, P=null;
function refreshRoom(){ P=roomPoints(); G=buildGrid(P); drawPlan(); updateSizeStatus(); }
function drawPlan(){
  const maxX=G.maxX,maxY=G.maxY,pad=Math.max(25,Math.max(maxX,maxY)*.06);
  const vw=maxX+pad*2, sw=Math.max(maxX,maxY)/220, fs=sw*9;
  const svg=$("svg");
  svg.setAttribute("viewBox",`${-pad} ${-pad} ${vw} ${maxY+pad*2}`);
  svg.setAttribute("aria-label",`חדר ${Math.round(maxX)} על ${Math.round(maxY)} ס״מ עם ${state.tables.length} שולחנות`);
  const col={ok:"var(--zone)",warn:"var(--warn)",bad:"var(--bad)"};
  const counts={ok:0,warn:0,bad:0};
  let zones="",tables="",dimsSvg="";
  const selT=sel?.type==="t"?sel.o:null;
  state.tables.forEach((t,k)=>{
    const st=tableStatus(t); counts[st]++;
    const D=dims(t), z=box(t.cx,t.cy,D.N), o=box(t.cx,t.cy,D.O), p=box(t.cx,t.cy,D.PL), isSel=t===selT;
    zones+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${isSel?"var(--felt-soft)":"none"}" fill-opacity=".55" stroke="${col[st]}" stroke-width="${sw*(isSel?1.2:.7)}" stroke-dasharray="${sw*4} ${sw*3}"/>`;
    const tfs=Math.min(fs*1.15,Math.min(D.PL[0],D.PL[1])/3.6);
    tables+=`<g data-t="${k}" style="cursor:grab">
      <rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="${sw*3}" fill="var(--wood)"/>
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="var(--felt)"/>
      ${st!=="ok"||isSel?`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="${sw*3}" fill="none" stroke="${isSel&&st==="ok"?"var(--ink)":col[st]}" stroke-width="${sw*1.6}"/>`:""}
      <text x="${t.cx}" y="${t.cy-tfs*.12}" text-anchor="middle" font-size="${tfs}" fill="#fff" font-weight="700" font-family="Assistant">${k+1}</text>
      <text x="${t.cx}" y="${t.cy+tfs*.95}" text-anchor="middle" font-size="${tfs*.75}" fill="#fff" font-family="Assistant">${t.L}×${t.W}</text>
    </g>`;
    if(isSel||state.tables.length===1){
      for(const [dx,dy,sx,sy] of [[-1,0,o.x,t.cy],[1,0,o.x+o.w,t.cy],[0,-1,t.cx,o.y],[0,1,t.cx,o.y+o.h]]){
        const r=rayDist(sx,sy,dx,dy,t), d=r.d; if(!isFinite(d)) continue;
        const short=d<(r.kind==="table"?GAP.table:GAP.wall)-.5, lc=short?"var(--bad)":"var(--ink)";
        const ex=sx+dx*d, ey=sy+dy*d, mx=(sx+ex)/2, my=(sy+ey)/2;
        dimsSvg+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${lc}" stroke-width="${sw*.6}"/>
          <circle cx="${ex}" cy="${ey}" r="${sw*1.4}" fill="${lc}"/>
          <text x="${mx+(dy?fs*.4:0)}" y="${my-(dx?fs*.35:0)}" text-anchor="${dy?"start":"middle"}" font-size="${fs*1.05}" font-weight="700" fill="${lc}" stroke="var(--surface)" stroke-width="${sw*2.6}" paint-order="stroke" font-family="Assistant">${Math.round(d)}</text>`;
      }
    }
  });
  const selC=sel?.type==="c"?sel.o:null;
  svg.innerHTML=
    `<path d="M${P.map(q=>q.join(" ")).join("L")}Z" fill="var(--bg)" stroke="var(--ink)" stroke-width="${sw*2}" stroke-linejoin="round"/>`+
    zones+tables+
    state.cols.map((c,i)=>`<rect data-col="${i}" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" fill="var(--pillar)" stroke="${c===selC?"var(--felt)":"transparent"}" stroke-width="${c===selC?sw*2:sw*10}" style="cursor:grab"/>`).join("")+
    dimsSvg+
    `<text x="${maxX/2}" y="${-pad*.3}" text-anchor="middle" font-size="${fs}" fill="var(--muted)" font-family="Assistant" direction="rtl">${Math.round(maxX)} ס״מ</text>`+
    `<text transform="translate(${-pad*.35} ${maxY/2}) rotate(-90)" text-anchor="middle" font-size="${fs}" fill="var(--muted)" font-family="Assistant" direction="rtl">${Math.round(maxY)} ס״מ</text>`;
  const n=state.tables.length, sum=$("summary");
  if(!n){ sum.textContent="אין עדיין שולחנות בחדר"; sum.className="sum"; }
  else if(!counts.warn&&!counts.bad){ sum.textContent=`${n} שולחנות · הכל במרחק תקין`; sum.className="sum ok"; }
  else { sum.textContent=`${n} שולחנות · `+[counts.warn&&`${counts.warn} קרובים מדי`,counts.bad&&`${counts.bad} חוסמים`].filter(Boolean).join(" · "); sum.className="sum "+(counts.bad?"bad":"warn"); }
  saveRoom();
}

/* ---------- stepper control ---------- */
function stepper(id,label,val,{step=10,min=0,max=3000,unit="ס״מ",onChange}){
  const w=document.createElement("div"); w.className="stp";
  w.innerHTML=`<label for="${id}">${label}</label>
    <div class="stp-row"><button type="button" class="stp-b" aria-label="פחות">−</button>
      <span class="stp-mid"><input id="${id}" type="number" inputmode="numeric" value="${val}"><span class="unit">${unit}</span></span>
      <button type="button" class="stp-b" aria-label="יותר">+</button></div>`;
  const inp=w.querySelector("input"), [minus,plus]=w.querySelectorAll(".stp-b");
  const set=v=>{v=clamp(v,min,max); inp.value=v; onChange(v);};
  minus.onclick=()=>set(+inp.value-step); plus.onclick=()=>set(+inp.value+step);
  inp.oninput=()=>{ if(inp.value!==""&&+inp.value>=min) onChange(clamp(inp.value,min,max)); };
  inp.onblur=()=>{ inp.value=clamp(inp.value,min,max); };
  inp.onfocus=()=>inp.select();
  return w;
}

/* ---------- tables ---------- */
function newTable(it){ return {name:it.name,kind:it.kind,L:it.L,W:it.W,cx:0,cy:0,rot:false}; }
function addTable(it){
  pushUndo(true);
  const t=newTable(it); state.tables.push(t);
  const s=findSpot(t);
  if(s){t.cx=s.cx;t.cy=s.cy;t.rot=s.rot; toast(`נוסף ${it.name}. גררו אותו כדי להזיז.`);}
  else { t.cx=G.maxX/2; t.cy=G.maxY/2; t.rot=G.maxX<G.maxY; toast("אין מקום פנוי במרחקים שקבעתם. השולחן סומן באדום."); }
  select({type:"t",o:t});
}
function fillRoom(it){
  pushUndo(true);
  let bestSet=[];
  for(const byCol of [false,true]) for(const rots of [[false,true],[false],[true]]){
    state.tables=[];
    for(let n=0;n<100;n++){ const t=newTable(it); const s=findSpot(t,byCol,rots); if(!s) break; t.cx=s.cx;t.cy=s.cy;t.rot=s.rot; state.tables.push(t); }
    if(state.tables.length>bestSet.length) bestSet=state.tables;
  }
  state.tables=bestSet;
  select(null);
  const n=state.tables.length;
  toast(n?`נכנסו ${n} שולחנות ${it.name}. אפשר לגרור כל אחד.`:"לא נכנס אף שולחן במרחקים שקבעתם. נסו מרחקים קטנים יותר.");
}

function renderGaps(){

  const s1=section("מרחק סביב כל שולחן");

  const chips=document.createElement("div"); chips.className="chips three";
  presets.forEach(([n,v])=>{
    const b=document.createElement("button"); b.type="button"; b.className="chip";
    b.setAttribute("aria-pressed",GAP.wall===v&&GAP.table===v);
    b.innerHTML=`${n}<small>${v} ס״מ</small>`;
    b.onclick=()=>{GAP.wall=GAP.table=v; saveGaps(); refreshRoom(); renderGaps();};
    chips.append(b);
  });
  s1.append(chips);
  s1.insertAdjacentHTML("beforeend",`<p class="hint">מודדים משפת השולחן. למשחק נוח עם מקל רגיל מקובל כ־140 ס״מ. במקום צפוף אפשר לשחק עם מקל קצר.</p>`);
  p.append(s1);
  const s2=section("או לקבוע לבד"), g=document.createElement("div"); g.className="grid2";
  const sync=()=>document.querySelectorAll(".chips.three .chip").forEach((b,i)=>b.setAttribute("aria-pressed",GAP.wall===presets[i][1]&&GAP.table===presets[i][1]));
  g.append(stepper("gW","מהקיר ומעמודים",GAP.wall,{step:10,min:0,max:400,onChange:v=>{GAP.wall=v;saveGaps();refreshRoom();sync();}}),
           stepper("gT","בין שולחנות",GAP.table,{step:10,min:0,max:400,onChange:v=>{GAP.table=v;saveGaps();drawPlan();sync();}}));
  s2.append(g); p.append(s2);
  p.insertAdjacentHTML("beforeend",`<p class="hint" style="margin:0">אחרי שינוי מרחקים, "מילוי החדר" בלשונית שולחנות מסדר מחדש לפי המרחקים החדשים. מספר אדום בציור אומר שהמרחק קטן ממה שקבעתם.</p>`);
}

/* ---------- toast ---------- */
let toastT=0;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }

/* ---------- dragging on the plan ---------- */
let drag=null, raf=0;
const svgEl=$("svg");
function toRoom(e){const pt=svgEl.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svgEl.getScreenCTM().inverse());}
svgEl.addEventListener("pointerdown",e=>{
  const g=e.target.closest("[data-t],[data-col]");
  if(!g){ drag={none:true}; return; }
  const q=toRoom(e);
  if(g.dataset.t!==undefined){ const t=state.tables[+g.dataset.t]; drag={o:t,t:true,dx:q.x-t.cx,dy:q.y-t.cy,moved:false}; if(sel?.o!==t) select({type:"t",o:t}); }
  else { const c=state.cols[+g.dataset.col]; drag={o:c,t:false,dx:q.x-c.x,dy:q.y-c.y,moved:false}; if(sel?.o!==c) select({type:"c",o:c}); }
  svgEl.setPointerCapture(e.pointerId); e.preventDefault();
});
svgEl.addEventListener("pointermove",e=>{
  if(!drag||drag.none) return;
  const q=toRoom(e), snap=v=>Math.round(v/CELL)*CELL;
  if(!drag.moved){ pushUndo(true); drag.moved=true; }
  if(drag.t){ drag.o.cx=snap(q.x-drag.dx); drag.o.cy=snap(q.y-drag.dy); }
  else { drag.o.x=Math.max(0,snap(q.x-drag.dx)); drag.o.y=Math.max(0,snap(q.y-drag.dy)); G=buildGrid(P); }
  cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{drawPlan(); if(sel) renderSelHead();});
});
function renderSelHead(){ if(sel?.type==="t"){ const st=tableStatus(sel.o), el=$("selbar").querySelector(".selhead span"); if(el){el.className=st; el.textContent={ok:"",warn:" · קרוב מדי",bad:" · חוסם"}[st];} } }
const endDrag=()=>{
  if(drag?.none){ select(null); }
  else if(drag&&!drag.t&&drag.moved) updateSizeStatus();
  drag=null;
};
svgEl.addEventListener("pointerup",endDrag); svgEl.addEventListener("pointercancel",()=>{drag=null;});

/* ---------- sketch analysis (only inside Claude) ---------- */
let sample=null, sketchBlob=null, sketchURL="";
(async()=>{
  try{
    const s=window.claude?.use?await window.claude.use("sample"):null;
    if(!s) return;
    const lim=await s.limits().catch(()=>null);
    if(lim&&lim.images){ sample=s; if(tab==="room") renderRoom(); }
  }catch(e){}
})();
const PROMPT=`זהו שרטוט של חדר (תוכנית קומה במבט מלמעלה) עם מידות, ייתכן שבכתב יד.
החזר JSON בלבד, בלי טקסט נוסף, בצורה:
{"points":[[x,y],...],"columns":[{"x":0,"y":0,"w":0,"h":0}],"notes":"..."}
- points: פינות הקירות לפי הסדר, בס"מ. ראשית הצירים בפינה השמאלית העליונה של השרטוט, x גדל ימינה, y גדל למטה.
- columns: עמודים או בליטות בתוך החדר (מלבנים), x,y הם הפינה השמאלית העליונה שלהם. רשימה ריקה אם אין.
- אם המידות במטרים, המר לס"מ. אם חסרה מידה, הערך מהפרופורציות וציין זאת ב-notes בעברית.
- notes: משפט קצר בעברית על מה זוהה ועל כל הנחה שעשית.`;
async function analyzeSketch(){
  const btn=$("skGo"), st=$("skStatus");
  const say=(t,c)=>{st.hidden=false; st.textContent=t; st.className="status "+(c||"");};
  btn.disabled=true; say("מזהה את המידות, זה יכול לקחת עד דקה...");
  try{
    const r=await sample.json(PROMPT,{images:[sketchBlob],modelTier:"complex"});
    const pts=(r.points||[]).map(p=>[Math.round(+p[0]),Math.round(+p[1])]).filter(p=>isFinite(p[0])&&isFinite(p[1]));
    if(pts.length<3) throw {code:"shape"};
    pushUndo(true);
    const mx=Math.min(...pts.map(p=>p[0])), my=Math.min(...pts.map(p=>p[1]));
    state.custom=pts.map(p=>[p[0]-mx,p[1]-my]);
    state.cols=(r.columns||[]).map(c=>({x:Math.round(c.x-mx),y:Math.round(c.y-my),w:Math.max(5,Math.round(c.w)),h:Math.max(5,Math.round(c.h))})).filter(c=>[c.x,c.y,c.w,c.h].every(isFinite));
    state.tables=[]; select(null); refreshRoom(); renderRoom();
    $("skStatus").hidden=false; $("skStatus").className="status ok";
    $("skStatus").textContent="זוהה: "+(r.notes||"צורת החדר עודכנה.")+" כדאי להשוות את הציור לשרטוט.";
  }catch(e){
    const m={not_granted:"צריך לאשר ל־Claude לקרוא את התמונה.",rate_limited:"יותר מדי בקשות כרגע. נסו שוב בעוד דקה.",shape:"לא הצלחתי לזהות את הקירות. נסו צילום ברור יותר, עם מידה כתובה על כל קיר."};
    say(m[e?.code]||"הזיהוי לא הצליח. נסו שוב או הכניסו את המידות ידנית.","bad");
    btn.disabled=false;
  }
}

/* ---------- start ---------- */
P=roomPoints(); G=buildGrid(P);
if(firstRun){
  const it=items.find(x=>/9 פיט/.test(x.name))||items[0], t=newTable(it), s=placeAny(dims(t).N,G)||placeAny(dims(t).O,G);
  if(s){t.cx=s.cx;t.cy=s.cy;t.rot=s.rot; state.tables.push(t);}
}
if(!store.get("tf-tip-done",false)) $("tip").hidden=false;
$("tipOk").onclick=()=>{ $("tip").hidden=true; store.set("tf-tip-done",true); };
setTab(["room","tables","gaps"].includes(tab)?tab:"tables");
drawPlan();
</script>

<script>
/* Auto-update: when a newer version is published, reload into it. */
const APP_VERSION="7";
async function checkUpdate(){
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});
    const v=(await r.json()).version;
    if(v && v!==APP_VERSION){
      if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
      const reg=await navigator.serviceWorker?.getRegistration(); await reg?.update();
      location.reload();
    }
  }catch(e){}
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
checkUpdate();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
</script>
